name: Preview Deploy (Leaderboard)

on:
  push:
    branches:
      - claude/magical-gauss-7x1ce
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble preview site
        run: |
          mkdir -p _site
          # Leaderboard is the landing page of the preview
          cp reply-whitelabel/leaderboard.html _site/index.html
          # Keep the rest of the white-label UI reachable too
          cp reply-whitelabel/*.html _site/ 2>/dev/null || true
          cp reply-whitelabel/styles.css _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
